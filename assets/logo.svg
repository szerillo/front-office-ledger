<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Front Office Ledger: a baseball ruled like ledger paper.
       Blue feint lines = the ledger; red seams = the stitching;
       drawn by hand, three colors, reads at 16px. -->
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="26"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="26" fill="#faf6ec"/>
  <g clip-path="url(#ball)" stroke="#9db6cc" stroke-width="1.4">
    <line x1="4" y1="18" x2="60" y2="18"/>
    <line x1="4" y1="25" x2="60" y2="25"/>
    <line x1="4" y1="32" x2="60" y2="32"/>
    <line x1="4" y1="39" x2="60" y2="39"/>
    <line x1="4" y1="46" x2="60" y2="46"/>
  </g>
  <g clip-path="url(#ball)" fill="none" stroke="#9d3025" stroke-width="2.6" stroke-linecap="round">
    <path d="M 13 7 C 24 20, 24 44, 13 57"/>
    <path d="M 51 7 C 40 20, 40 44, 51 57"/>
  </g>
  <g clip-path="url(#ball)" stroke="#9d3025" stroke-width="1.7" stroke-linecap="round">
    <line x1="17.1" y1="15.5" x2="22.1" y2="13.1"/>
    <line x1="19.6" y1="23.5" x2="25.0" y2="22.1"/>
    <line x1="20.4" y1="32.0" x2="25.9" y2="32.0"/>
    <line x1="19.6" y1="40.5" x2="25.0" y2="41.9"/>
    <line x1="17.1" y1="48.5" x2="22.1" y2="50.9"/>
    <line x1="46.9" y1="15.5" x2="41.9" y2="13.1"/>
    <line x1="44.4" y1="23.5" x2="39.0" y2="22.1"/>
    <line x1="43.6" y1="32.0" x2="38.1" y2="32.0"/>
    <line x1="44.4" y1="40.5" x2="39.0" y2="41.9"/>
    <line x1="46.9" y1="48.5" x2="41.9" y2="50.9"/>
  </g>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1d1a14" stroke-width="2.6"/>
</svg>
